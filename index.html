<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKGPT - Halloween Edition</title>
    <style>
        :root {
            --bg-color: #0b090a;
            --text-color: #f1f1f1;
            --accent: #ff7518; /* Orange Halloween */
            --accent-glow: rgba(255, 117, 24, 0.4);
            --panel-bg: #161214;
            --border-color: #2c2227;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header.header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            box-shadow: 0 4px 12px rgba(255, 117, 24, 0.1);
        }

        .logo-item {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .chat-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .chat-window {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 117, 24, 0.15);
        }

        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            background-color: #120e10;
            color: var(--accent);
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user-message {
            background-color: #2a2024;
            align-self: flex-end;
            border: 1px solid #4a353c;
        }

        .ai-message {
            background-color: #1a1417;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            background-color: #120e10;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            color: var(--text-color);
            border: none;
            resize: none;
            padding: 0.5rem;
            font-size: 1rem;
            outline: none;
            max-height: 100px;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2a2024;
        }

        #send-btn {
            background-color: var(--accent);
            color: #0b090a;
            font-weight: bold;
            border: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-item">🎃 DARKGPT (Halloween Edition) 🦇</div>
    </header>

    <section class="chat-section">
        <div class="chat-window">
            <div class="chat-header">Interface de Chat Spooky</div>
            
            <!-- Conteneur des messages avec id="messages" -->
            <div class="chat-messages" id="messages">
                <div class="message ai-message">🎃 Bouh ! Prêt à explorer les ténèbres avec DARKGPT ?</div>
            </div>

            <div class="chat-input-area">
                <div class="input-box">
                    <!-- Champ de texte avec id="prompt" -->
                    <textarea id="prompt" rows="1" placeholder="Écris ton message maléfique..."></textarea>
                    <button id="mic-btn" title="Dictée vocale">🎤</button>
                    <!-- Bouton d'envoi avec id="send-btn" -->
                    <button id="send-btn">Envoyer</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Script JavaScript réparé et connecté à /api/chat -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('send-btn');
            const promptInput = document.getElementById('prompt');
            const messagesContainer = document.getElementById('messages');

            if (sendBtn && promptInput) {
                sendBtn.addEventListener('click', sendMessage);
                promptInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }

            async function sendMessage() {
                const text = promptInput.value.trim();
                if (!text) return;

                appendMessage(text, 'user-message');
                promptInput.value = '';

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await response.json();
                    appendMessage(data.reply || "Pas de réponse reçue.", 'ai-message');
                } catch (error) {
                    console.error("Erreur :", error);
                    appendMessage("Erreur de communication avec le serveur.", 'ai-message');
                }
            }

            function appendMessage(text, className) {
                if (!messagesContainer) return;
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${className}`;
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
